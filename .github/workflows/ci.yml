name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext python3-pil

      - name: Lint and unit tests
        run: make check

      - name: Validate with the official Spices script
        run: |
          mkdir -p "$RUNNER_TEMP/spices"
          curl -fsSL -o "$RUNNER_TEMP/spices/validate-spice" \
            https://raw.githubusercontent.com/linuxmint/cinnamon-spices-applets/master/validate-spice
          python3 "$RUNNER_TEMP/spices/validate-spice" ai-usage@dmcallejo
